services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-santera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-santera}
      POSTGRES_DB: ${POSTGRES_DB:-santera_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santera -d santera_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      FLASK_DEBUG: "1"
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-santera}:${POSTGRES_PASSWORD:-santera}@db:5432/${POSTGRES_DB:-santera_dev}
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

    command: flask --app run run --host=0.0.0.0 --port=5000 --debug
  
  frontend:
    build: ./frontend

    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://backend:5000
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  pgdata: